/* ---- network ---- */

async function api(path, options = {}) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...options,
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      ...(options.headers || {})
    }
  });
  if (!res.ok) throw new Error(res.status + ' ' + (await res.text()).slice(0, 200));
  return res.status === 204 ? null : res.json();
}

const shapeTrip = t => ({
  id: t.id, destination: t.destination, start: t.start_date, end: t.end_date,

  lastChange: t.last_change, updatedAt: t.updated_at

async function load() {
  const [pp, tt, rr, dd] = await Promise.all([
    api('people?select=*'), api('trips?select=*'), api('rsvps?select=*'),
    api('draws?select=*&order=created_at.desc&limit=40')
  ]);
  people = pp;
  trips  = tt.map(shapeTrip);
  rsvps  = rr.map(r => ({ tripId: r.trip_id, personId: r.person_id, status: r.status }));
  draws  = dd;
  lastSync = Date.now(); offline = false; stash();
}

const insert = (table, row) =>
  api(table, { method:'POST', headers:{ Prefer:'return=representation' }, body: JSON.stringify(row) });
const patch = (table, filter, row) =>
  api(`${table}?${filter}`, { method:'PATCH', headers:{ Prefer:'return=representation' },
                              body: JSON.stringify(row) });
const upsertRsvp = row =>
  api('rsvps', { method:'POST',
    headers:{ Prefer:'resolution=merge-duplicates,return=representation' },
    body: JSON.stringify(row) });
const removeRsvp = (tripId, personId) =>
  api(`rsvps?trip_id=eq.${tripId}&person_id=eq.${personId}`, { method:'DELETE' });

/* ---- cache ---- */

function stash() {
  try { localStorage.setItem(CACHE,
    JSON.stringify({ people, trips, rsvps, draws, at: lastSync })); } catch (e) {}
}
function unstash() {
  try {
    const raw = localStorage.getItem(CACHE);
    if (!raw) return false;
    const c = JSON.parse(raw);
    people = c.people || []; trips = c.trips || [];
    rsvps = c.rsvps || []; draws = c.draws || [];
    lastSync = c.at || null;
    return true;
  } catch (e) { return false; }
}

let queue = Promise.resolve();
function enqueue(fn) {
  queue = queue.then(fn).catch(async () => {
    toast('Not saved — reloading');
    try { await load(); } catch (e) { offline = true; }
    render();
  });
}

/* ---- helpers ---- */

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const nameOf = id => (people.find(p => p.id === id) || {}).name || 'Someone';
const today = () => new Date().toISOString().slice(0, 10);
const endOf = t => t.end || t.start;

function addDays(iso, n) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}
function isDark() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t) return t === 'dark';
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function toggleTheme() {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('siena:theme', next); } catch (e) {}
  render();
}
function fmt(iso) {
  if (!iso) return '';
  return new Date(iso + 'T12:00:00')
    .toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
}
function dateMark(iso) {
  const d = new Date(iso + 'T12:00:00');
  return `<span class="datemark">${d.toLocaleDateString('en-GB',{weekday:'short'})}<b>${d.getDate()}</b>${d.toLocaleDateString('en-GB',{month:'short'})}</span>`;
}
function nightsLabel(t) {
  if (!t.end || t.end <= t.start) return '';
  const n = Math.round((new Date(t.end) - new Date(t.start)) / 86400000);
  return `<span class="nights">${n} night${n > 1 ? 's' : ''}</span>`;
}
function daysAway(iso) {
  const n = Math.round((new Date(iso + 'T12:00:00') - new Date(today() + 'T12:00:00')) / 86400000);
  if (n <= 0) return 'today';
  if (n === 1) return 'tomorrow';
  return `in ${n} days`;
}
function ago(ts) {
  if (!ts) return 'never';
  const m = Math.round((Date.now() - (typeof ts === 'number' ? ts : Date.parse(ts))) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h} hr ago`;
  return `${Math.round(h / 24)} d ago`;
}
function roll(list, verb) {
  const names = list.map(r => nameOf(r.personId));
  if (names.length === 1) return `<b>${esc(names[0])}</b> is ${verb}`;
  if (names.length === 2) return `<b>${esc(names[0])}</b> and <b>${esc(names[1])}</b> are ${verb}`;
  return `<b>${esc(names[0])}</b> and ${names.length - 1} others are ${verb}`;
}

const overlap = (a, b) => a.start <= endOf(b) && b.start <= endOf(a);
const countIn    = id => rsvps.filter(r => r.tripId === id && r.status === 'in').length;
const countMaybe = id => rsvps.filter(r => r.tripId === id && r.status === 'maybe').length;
function myTrips() {
  const ids = rsvps.filter(r => r.personId === meId && r.status === 'in').map(r => r.tripId);
  return trips.filter(t => ids.includes(t.id));
}
const clashesFor = trip => myTrips().filter(o => o.id !== trip.id && overlap(trip, o));
const upcoming = () => trips.filter(t => endOf(t) >= today())
                            .sort((a, b) => a.start.localeCompare(b.start));

function pick(items) {
  const n = items.length, buf = new Uint32Array(1);
  const limit = Math.floor(4294967296 / n) * n;
  let v;
  do { crypto.getRandomValues(buf); v = buf[0]; } while (v >= limit);
  return items[v % n];
}

/* ---- reading the program calendar ---- */

const lastDay = e => e.end || e.start;
const covers  = (e, day) => day >= e.start && day <= lastDay(e);
const isBlocked = day => PROGRAM.some(e => e.blocks && covers(e, day));
const programOn = day => PROGRAM.filter(e => covers(e, day));

function daysBetween(start, end) {
  const out = [];
  if (!start) return out;
  const stop = end && end > start ? end : start;
  for (let d = start, guard = 0; d <= stop && guard < 60; d = addDays(d, 1), guard++)
    out.push(d);
  return out;
}

/* Everything a proposal spanning these dates runs into. */
function programClashes(start, end) {
  const days = daysBetween(start, end);
  return PROGRAM.filter(e => days.some(d => covers(e, d)));
}

/* A day is travel-capable if it is a Friday, Saturday or Sunday — there are no
   Friday classes — and the program has not already claimed it. Weekday
   afternoons are free from noon but are not whole days, so they are not
   counted here. */
function freeWindows(fromIso, span) {
  const out = [];
  let run = null;
  for (let i = 0; i <= span; i++) {
    const day = addDays(fromIso, i);
    if (day > PROGRAM_END) break;
    if (day < PROGRAM_START) continue;
    const dow = new Date(day + 'T12:00:00').getDay();
    const open = (dow === 5 || dow === 6 || dow === 0)
                 && !isBlocked(day)
                 && !trips.some(t => t.start <= day && endOf(t) >= day);
    if (!open) { run = null; continue; }
    if (run && addDays(run.end, 1) === day) run.end = day;
    else { run = { start: day, end: day }; out.push(run); }
  }
  return out;
}

function windowLabel(w) {
  return w.end > w.start ? `${fmt(w.start)} – ${fmt(w.end)}` : fmt(w.start);
}

/* Reasons a free window might still be a bad idea. */
function windowCaution(w) {
  const bits = [];
  for (const d of daysBetween(w.start, w.end))
    for (const e of programOn(d))
      if (!e.blocks && !bits.includes(e.title)) bits.push(e.title);
  const after = addDays(w.end, 1);
  const next = PROGRAM.find(e => e.blocks && e.course === 'all' && covers(e, after));
  if (next) bits.push(next.title.split('—')[0].trim() + ' the next morning');
  return bits.length ? ` (${bits.join(', ')})` : '';
}

/* ---- what needs attention ---- */

function attentionItems() {
  const out = [], t0 = today(), soon = addDays(t0, 7);

  for (const t of upcoming()) {
    if (!t.minPeople || t.start > soon) continue;
    const short = t.minPeople - countIn(t.id);
    if (short > 0)
      out.push(`${t.destination} needs ${short} more by ${fmt(t.start)}`);
  }

  for (const t of upcoming()) {
    if (t.start > addDays(t0, 3)) continue;
    const m = countMaybe(t.id);
    if (m > 0)
      out.push(`${m} still undecided on ${t.destination} — ${daysAway(t.start)}`);
  }

  for (const w of freeWindows(addDays(t0, 1), 21).slice(0, 2))
    out.push(`Nothing proposed for ${windowLabel(w)}${windowCaution(w)}`);

  return out.slice(0, 5);
}

/* ---- the weekly digest ---- */

function weekDigest() {
  const t0 = today(), horizon = addDays(t0, 7);
  const up = upcoming();
  const thisWeek = up.filter(t => t.start <= horizon);
  const later    = up.filter(t => t.start > horizon);

  const lines = ["Where's everyone going — next 7 days", ''];

  if (!thisWeek.length) {
    lines.push('Nothing on the board yet. Somebody propose something.');
    lines.push('');
  } else {
    for (const t of thisWeek) {
      const when = t.end && t.end > t.start
        ? `${fmt(t.start)} – ${fmt(t.end)}` : fmt(t.start);
      lines.push(`${when} · ${t.destination}`);

      const bits = [];
      if (t.meetPoint || t.meetTime)
        bits.push(`meet ${[t.meetPoint, t.meetTime].filter(Boolean).join(' ')}`);
      if (t.cost) bits.push(`~€${Math.round(t.cost)}`);
      const g = countIn(t.id), m = countMaybe(t.id);
      bits.push(`${g} in${m ? `, ${m} maybe` : ''}`);
      if (t.minPeople && g < t.minPeople) bits.push(`${t.minPeople - g} more needed to book`);
      lines.push('  ' + bits.join(' — '));
      lines.push('');
    }
  }

  if (later.length) {
    lines.push('Further out: ' + later.slice(0, 4)
      .map(t => `${t.destination} (${fmt(t.start)})`).join(', '));
    lines.push('');
  }

  const fixed = PROGRAM
    .filter(e => e.blocks && lastDay(e) >= t0 && e.start <= horizon)
    .sort((a, b) => a.start.localeCompare(b.start));
  if (fixed.length) {
    lines.push('Fixed by the program:');
    for (const e of fixed) {
      const when = e.end && e.end > e.start
        ? `${fmt(e.start)} – ${fmt(e.end)}` : fmt(e.start);
      lines.push(`  ${when} · ${e.title}` +
        (e.course === 'all' ? '' : ` (${COURSES[e.course]})`) +
        (e.tbc ? ' — not yet confirmed' : ''));
    }
    lines.push('');
  }

  const gaps = freeWindows(addDays(t0, 1), 14).slice(0, 2);
  if (gaps.length) {
    lines.push('Free and unclaimed: ' +
      gaps.map(w => windowLabel(w) + windowCaution(w)).join('; '));
    lines.push('');
  }

  if (SITE_URL) lines.push(SITE_URL);

  return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

function openDigest() {
  const text = weekDigest();
  const el = document.createElement('div');
  el.className = 'sheet';
  el.onclick = e => { if (e.target === el) el.remove(); };
  el.innerHTML = `<div class="sheet-inner">
    <h2>This week</h2>
    <p class="lede">Post it in the chat on Sunday night. Doing it every week is the whole trick.</p>
    <div class="preview">${esc(text)}</div>
    <button class="newbtn" onclick="copyText(${JSON.stringify(text).replace(/"/g,'&quot;')}, this)">Copy</button>
  </div>`;
  document.body.appendChild(el);
}

/* ---- rendering ---- */

function dossier() {
  const t0 = today();
  const mine = myTrips().filter(t => endOf(t) >= t0)
                        .sort((a, b) => a.start.localeCompare(b.start));
  if (!mine.length) return '';
  const spend = mine.reduce((s, t) => s + (Number(t.cost) || 0), 0);
  const next = mine[0];
  const clashing = mine.filter(t => clashesFor(t).length).length;

  let l = `<span class="cap">Your ledger</span>In for <b>${mine.length}</b> trip${mine.length > 1 ? 's' : ''}`;
  if (spend > 0) l += ` &middot; <b>&euro;${Math.round(spend)}</b> committed`;
  l += `<br>Next: <b>${esc(next.destination)}</b>, ${fmt(next.start)} — ${daysAway(next.start)}`;
  if (clashing) l += `<br><span class="warn">${clashing === 2
    ? 'Two of your trips overlap' : `${clashing} of your trips overlap`}</span>`;
  return `<div class="dossier">${l}</div>`;
}

function attentionBlock() {
  const items = attentionItems();
  if (!items.length) return '';
  return `<div class="attention"><span class="cap">Needs a nudge</span>
    <ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`;
}

function boardHtml() {
  const t0 = today();
  const list = trips.filter(t => showPast ? endOf(t) < t0 : endOf(t) >= t0)
    .sort((a, b) => showPast ? String(b.start).localeCompare(a.start)
                             : String(a.start).localeCompare(b.start));

  let html = `<div class="whoami">
      <span>You are ${esc(nameOf(meId))}</span>
      <span class="right">
        <button class="linkbtn" onclick="toggleTheme()">${isDark() ? 'light' : 'dark'}</button>
        <button class="linkbtn" onclick="refresh(this)">refresh</button>
        <button class="linkbtn" onclick="forget()">not you?</button>
      </span>
    </div>`;

  if (offline) html += `<div class="stale">No signal — showing the board as of ${ago(lastSync)}.</div>`;
  if (!showPast) { html += dossier(); html += attentionBlock(); }

  if (!list.length) {
    html += showPast
      ? `<div class="empty-note">Nothing behind you yet.</div>`
      : `<div class="empty-note">No trips proposed yet. Somebody has to go first — it may as well be you.</div>`;
  }

  for (const t of list) {
    const mine  = rsvps.filter(r => r.tripId === t.id);
    const going = mine.filter(r => r.status === 'in');
    const maybe = mine.filter(r => r.status === 'maybe');
    const my    = mine.find(r => r.personId === meId);

    const meta = [];
    if (t.meetPoint || t.meetTime)
      meta.push(`<span>${esc([t.meetPoint, t.meetTime].filter(Boolean).join(', '))}</span>`);
    if (t.cost) meta.push(`<span>~&euro;${Math.round(t.cost)}</span>`);
    meta.push(`<span>by ${esc(nameOf(t.proposedBy))}</span>`);

    let tags = '';
    if (t.minPeople) {
      tags += going.length >= t.minPeople
        ? `<span class="tag met">${t.minPeople} needed — confirmed</span>`
        : `<span class="tag short">${t.minPeople - going.length} more needed to book</span>`;
    }
    if (t.lastChange && endOf(t) >= t0)
      tags += `<span class="tag edit">Changed ${ago(t.updatedAt)}: ${esc(t.lastChange)}</span>`;
    if (my && my.status === 'in') {
      const clash = clashesFor(t);
      if (clash.length) tags += `<span class="tag clash">Overlaps ${
        clash.map(c => esc(c.destination)).join(' and ')}</span>`;
    }

    const blocks = [
      ...going.map(r => `<i class="in" title="${esc(nameOf(r.personId))} — in"></i>`),
      ...maybe.map(r => `<i class="mb" title="${esc(nameOf(r.personId))} — maybe"></i>`)
    ].join('');

    html += `<div class="entry">
      <div class="entry-head">
        ${dateMark(t.start)}
        <div style="flex:1;min-width:0">
          <h3 class="dest">${esc(t.destination)}${nightsLabel(t)}</h3>
          <div class="meta">${meta.join('')}</div>
        </div>
      </div>
      ${t.notes ? `<p class="notes">${esc(t.notes)}</p>` : ''}
      ${blocks ? `<div class="banner">${blocks}</div>` : `<div class="banner empty"></div>`}
      <div class="roll">${going.length
        ? roll(going, 'in')
        : `<span class="nobody">Nobody signed up yet</span>`}${
        maybe.length ? `<span class="maybe">, ${roll(maybe,'maybe').replace(/<\/?b>/g,'')}</span>` : ''}</div>
      ${tags}
      <div class="actions">
        <button class="${my && my.status === 'in' ? 'on' : ''}" onclick="rsvp('${t.id}','in')">I'm in</button>
        <button class="${my && my.status === 'maybe' ? 'on maybe' : ''}" onclick="rsvp('${t.id}','maybe')">Maybe</button>
        <button class="ghost" onclick="copyTrip('${t.id}')">Copy</button>
        ${t.proposedBy === meId
          ? `<button class="ghost" onclick="openForm('${t.id}')" aria-label="Edit this trip">Edit</button>
             <button class="ghost" onclick="dropTrip('${t.id}')" aria-label="Delete this trip">&times;</button>`
          : ''}
      </div>
    </div>`;
  }

  html += `<button class="newbtn" onclick="openForm()">Propose a trip</button>
    <button class="quietbtn" onclick="openDigest()">Copy this week for the chat</button>
    <div class="past-toggle"><button class="linkbtn" onclick="togglePast()">
      ${showPast ? 'back to upcoming' : 'see past trips'}</button></div>`;

  return html;
}

/* Free Fri-Sun windows across the whole program, ignoring what is on the
   board — this is a reference table, not a live scan. */
function allFreeWindows() {
  const out = [];
  let run = null;
  for (let d = PROGRAM_START; d <= PROGRAM_END; d = addDays(d, 1)) {
    const dow = new Date(d + 'T12:00:00').getDay();
    if (!(dow === 5 || dow === 6 || dow === 0) || isBlocked(d)) { run = null; continue; }
    if (run && addDays(run.end, 1) === d) run.end = d;
    else { run = { start: d, end: d }; out.push(run); }
  }
  return out;
}

function topic(title, inner, note, open) {
  return `<details class="topic"${open ? ' open' : ''}>
    <summary>${title}</summary>
    ${note ? `<p class="topicnote">${note}</p>` : ''}
    ${inner}
  </details>`;
}

function italianHtml() {
  const sounds = topic('Nine rules that fix most of your pronunciation',
    `<div class="rulelist">${SOUNDS.map(([a, b]) =>
      `<div><b>${a}</b> \u2014 ${b}</div>`).join('')}</div>
     <p class="topicnote" style="padding-top:10px">Stress falls on the second-to-last syllable
     unless an accent says otherwise (citt\u00e0, perch\u00e9). Every vowel is pronounced \u2014 there are
     no silent letters. CAPITALS below mark the stressed syllable.</p>`);

  const body = PHRASES.map(sec => topic(sec.title,
    sec.rows.map(([en, it, say]) => `<div class="ph">
      <div class="en">${en}</div>
      <div class="it">${it}</div>
      <div class="say">${say}</div></div>`).join(''),
    sec.note, sec.open)).join('');

  const notes = topic('Two things the official list does not tell you',
    `<div class="ph"><div class="en">Words change with your gender</div>
       <div class="it">Sono stanco / Sono stanca</div>
       <div class="say">A man is tired / a woman is tired</div></div>
     <p class="topicnote">Anything ending in <b>-o</b> becomes <b>-a</b> if you are female. The
     U of T list gives only the masculine forms without saying so. Words ending in <b>-e</b>,
     like <i>canadese</i> and <i>studente</i>, do not change.</p>
     <div class="ph"><div class="en">There are two ways to say &ldquo;you&rdquo;</div>
       <div class="it">Mi scusi \u2192 Scusa &nbsp;\u00b7&nbsp; Parla inglese? \u2192 Parli inglese?</div>
       <div class="say">formal \u2192 informal</div></div>
     <p class="topicnote">The official list is entirely formal, which is right for shopkeepers,
     officials and anyone older, but sounds stiff with people your own age. When in doubt use the
     formal one \u2014 being slightly too polite costs nothing.</p>`);

  return `<div class="doc">
    <h2>Survival Italian</h2>
    <p class="lede">Built from the U of T student guide vocabulary list, corrected and extended.
    The guide warns that not speaking Italian in an emergency is &ldquo;an insurmountable
    challenge&rdquo; and then supplies no emergency vocabulary at all, and none for allergies
    despite telling you to write yours down. Those sections are new here, along with transport,
    food, money and pronunciation.</p>
    ${sounds}${body}${notes}
    <button class="quietbtn" onclick="window.print()">Print this page</button>
    <p class="src">Corrections to the U of T list: <i>nove</i>, not &ldquo;ove&rdquo;, for 9.
    The emergency, allergy, transport and money sections are additions.
    <b>The allergy section is safety-critical \u2014 check it against a second source or a fluent
    speaker before relying on it.</b></p>
  </div>`;
}

/* Printing a collapsed section prints nothing, so open everything first. */
window.addEventListener('beforeprint', () => {
  document.querySelectorAll('details.topic').forEach(d => {
    if (!d.open) { d.dataset.wasShut = '1'; d.open = true; }
  });
});
window.addEventListener('afterprint', () => {
  document.querySelectorAll('details.topic[data-was-shut]').forEach(d => {
    d.open = false; delete d.dataset.wasShut;
  });
});

/* ---- identity ---- */

async function claim(btn) {
  const pick = document.getElementById('pick');
  const chosen = pick ? pick.value : '__new';
  if (!chosen) return toast('Pick a name first');
  if (chosen !== '__new') { meId = chosen; remember(meId); return render(); }

  const nm = document.getElementById('nm').value.trim();
  if (!nm) return toast('Type your name first');
  const dupe = people.find(p => String(p.name).toLowerCase() === nm.toLowerCase());
  if (dupe) { meId = dupe.id; remember(meId); return render(); }

  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const [row] = await insert('people', { name: nm.slice(0, 60) });
    people.push({ id: row.id, name: row.name });
    meId = row.id; remember(meId); stash(); render();
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Continue';
    toast("Couldn't save that — try again");
  }
}
function remember(id) { try { localStorage.setItem('siena:me', id); } catch (e) {} }
function forget() {
  try { localStorage.removeItem('siena:me'); } catch (e) {}
  meId = null; render();
}

/* ---- rsvp ---- */

function rsvp(tripId, status) {
  const i = rsvps.findIndex(r => r.tripId === tripId && r.personId === meId);
  const clearing = i > -1 && rsvps[i].status === status;
  if (clearing) rsvps.splice(i, 1);
  else if (i > -1) rsvps[i] = { ...rsvps[i], status };
  else rsvps.push({ tripId, personId: meId, status });
  render(); stash();
  enqueue(() => clearing
    ? removeRsvp(tripId, meId)
    : upsertRsvp({ trip_id: tripId, person_id: meId, status,
                   updated_at: new Date().toISOString() }));
}

function dropTrip(tripId) {
  if (!confirm('Delete this trip for everyone?')) return;
  trips = trips.filter(t => t.id !== tripId);
  rsvps = rsvps.filter(r => r.tripId !== tripId);
  render(); stash();
  enqueue(() => api(`trips?id=eq.${tripId}`, { method:'DELETE' }));
}

async function refresh(btn) {
  btn.textContent = 'refreshing…';
  try { await load(); } catch (e) { offline = true; }
  render();
}

/* ---- propose / edit ---- */

const FIELDS = [
  ['destination', 'Destination'], ['start', 'Departure'], ['end', 'Return'],
  ['meetPoint', 'Meeting point'], ['meetTime', 'Meeting time'],
  ['cost', 'Cost'], ['minPeople', 'Minimum people']
];

function describeChanges(before, after) {
  const out = [];
  for (const [k, label] of FIELDS) {
    const a = before[k] == null || before[k] === '' ? '' : String(before[k]);
    const b = after[k]  == null || after[k]  === '' ? '' : String(after[k]);
    if (a === b) continue;
    if (!a) out.push(`${label} set to ${b}`);
    else if (!b) out.push(`${label} removed`);
    else out.push(`${label} ${a} → ${b}`);
  }
  if (String(before.notes || '') !== String(after.notes || '')) out.push('notes updated');
  return out.join('; ');
}

function openForm(tripId) {
  const t = tripId ? trips.find(x => x.id === tripId) : null;
  const val = v => v == null ? '' : esc(v);
  const el = document.createElement('div');
  el.className = 'sheet';
  el.onclick = e => { if (e.target === el) el.remove(); };
  el.innerHTML = `<div class="sheet-inner">
    <h2>${t ? 'Edit trip' : 'Propose a trip'}</h2>
    ${t ? `<p class="lede">Anyone already signed up will see what you changed.</p>` : ''}
    <label for="f-dest">Where</label>
    <input id="f-dest" placeholder="Florence" autocomplete="off" value="${val(t && t.destination)}">
    <div class="row">
      <div><label for="f-start">Leaving</label>
        <input id="f-start" type="date" value="${val(t ? t.start : today())}"></div>
      <div><label for="f-end">Back</label>
        <input id="f-end" type="date" value="${val(t && t.end)}"></div>
    </div>
    <p class="hint">Leave "back" empty for a day trip.</p>
    <div id="f-clash"></div>
    <div class="row">
      <div><label for="f-point">Meet at</label>
        <input id="f-point" placeholder="Piazza Gramsci" value="${val(t && t.meetPoint)}"></div>
      <div><label for="f-time">Time</label>
        <input id="f-time" placeholder="07:40" value="${val(t && t.meetTime)}"></div>
    </div>
    <div class="row">
      <div><label for="f-cost">Rough cost &euro;</label>
        <input id="f-cost" type="number" min="0" placeholder="18" value="${val(t && t.cost)}"></div>
      <div><label for="f-min">Min. people</label>
        <input id="f-min" type="number" min="0" placeholder="6" value="${val(t && t.minPeople)}"></div>
    </div>
    <label for="f-notes">Anything else</label>
    <textarea id="f-notes" placeholder="Hostel deposit due Monday">${val(t && t.notes)}</textarea>
    <button class="newbtn" onclick="saveTrip(this, ${t ? `'${t.id}'` : 'null'})">
      ${t ? 'Save changes' : 'Add to the board'}</button>
  </div>`;
  document.body.appendChild(el);
  document.getElementById('f-start').onchange = paintClash;
  document.getElementById('f-end').onchange = paintClash;
  paintClash();
  document.getElementById('f-dest').focus();
}

function clashSentence(list) {
  return list.map(e => {
    const when = e.end && e.end > e.start
      ? `${fmt(e.start)} – ${fmt(e.end)}` : fmt(e.start);
    const who = e.course === 'all' ? '' : COURSES[e.course] + ' in ';
    return `${who}${e.title}, ${when}${e.tbc ? ' (not confirmed)' : ''}`;
  }).join('; ');
}

function paintClash() {
  const box = document.getElementById('f-clash');
  if (!box) return;
  const s = document.getElementById('f-start').value;
  const hits = programClashes(s, document.getElementById('f-end').value);
  const hard = hits.filter(e => e.blocks), soft = hits.filter(e => !e.blocks);
  let html = '';
  if (hard.length)
    html += `<p class="clashnote">Clashes with the program: ${
      esc(clashSentence(hard))}. You can still propose it.</p>`;
  if (soft.length)
    html += `<p class="clashnote soft">Worth knowing: ${esc(clashSentence(soft))}.</p>`;
  box.innerHTML = html;
}

async function saveTrip(btn, tripId) {
  const v = id => document.getElementById(id).value.trim();
  if (!v('f-dest'))  return toast('Where are you going?');
  if (!v('f-start')) return toast('Pick a date');

  const hard = programClashes(v('f-start'), v('f-end')).filter(e => e.blocks);
  if (hard.length && !confirm(
        `That runs into the program: ${clashSentence(hard)}.\n\nPost it anyway?`))
    return;

  const body = {
    destination: v('f-dest').slice(0, 80),
    start_date:  v('f-start'),
    end_date:    v('f-end') || null,
    meet_point:  v('f-point') || null,
    meet_time:   v('f-time') || null,
    cost:        v('f-cost') ? Number(v('f-cost')) : null,
    min_people:  v('f-min') ? Number(v('f-min')) : null,
    notes:       v('f-notes') ? v('f-notes').slice(0, 400) : null
  };

  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    if (tripId) {
      const before = trips.find(t => t.id === tripId);
      const after  = shapeTrip({ ...body, id: tripId, proposed_by: before.proposedBy });
      const summary = describeChanges(before, after);
      if (!summary) { document.querySelector('.sheet').remove(); return; }
      body.last_change = summary.slice(0, 300);
      body.updated_at  = new Date().toISOString();
      const [row] = await patch('trips', `id=eq.${tripId}`, body);
      trips = trips.map(t => t.id === tripId ? shapeTrip(row) : t);
    } else {
      const [row] = await insert('trips', { ...body, proposed_by: meId });
      trips.push(shapeTrip(row));
      rsvps.push({ tripId: row.id, personId: meId, status: 'in' });
      enqueue(() => upsertRsvp({ trip_id: row.id, person_id: meId, status: 'in',
                                 updated_at: new Date().toISOString() }));
      showPast = false;
    }
    document.querySelector('.sheet').remove();
    stash(); render();
  } catch (e) {
    btn.disabled = false; btn.textContent = tripId ? 'Save changes' : 'Add to the board';
    toast("Couldn't save — try again");
  }
}

/* ---- the randomiser ---- */

let drawMode = 'coin', lastQuestion = '';

const MODE_COPY = {
  coin:     { title:'Flip a coin', lede:'Two options, one answer, no arguing.', cta:'Flip' },
  list:     { title:'Pick one',    lede:'One per line. Something gets chosen.', cta:'Draw' },
  dictator: { title:'Appoint someone',
              lede:'One name per line. Whoever is drawn decides, and nobody else gets a say.',
              cta:'Appoint' }
};

function setMode(m) { drawMode = m; renderDraw(); }

function renderDraw(result) {
  const body = document.getElementById('drawbody');
  if (!body) return;
  const c = MODE_COPY[drawMode];
  const inputs = drawMode === 'coin'
    ? `<label for="d-a">Option one</label>
       <input id="d-a" placeholder="Florence" autocomplete="off">
       <label for="d-b">Option two</label>
       <input id="d-b" placeholder="Stay in Siena" autocomplete="off">`
    : `<label for="d-items">${drawMode === 'dictator' ? 'Names' : 'Options'}, one per line</label>
       <textarea id="d-items" rows="5" placeholder="${drawMode === 'dictator'
          ? 'Jake M\nPriya S\nMarco T' : 'Pizzeria\nOsteria\nThat place by the Campo'}"></textarea>`;

  body.innerHTML = `
    <h2>${c.title}</h2>
    <p class="lede">${c.lede}</p>
    <div class="modes">
      ${['coin','list','dictator'].map(m =>
        `<button class="${m === drawMode ? 'on' : ''}" onclick="setMode('${m}')">${
          m === 'coin' ? 'Coin' : m === 'list' ? 'Pick one' : 'Appoint'}</button>`).join('')}
    </div>
    <label for="d-q">What's this deciding? (optional)</label>
    <input id="d-q" placeholder="Where to eat tonight" autocomplete="off" value="${esc(lastQuestion)}">
    ${inputs}
    ${result ? verdictHtml(result) : ''}
    <button class="newbtn" onclick="doDraw(this)">${c.cta}</button>
    ${ledgerHtml()}`;
}

function verdictHtml(r) {
  const said = r.kind === 'coin'     ? 'The coin has spoken.'
             : r.kind === 'dictator' ? 'Appointed. The matter rests with them.'
             : `Drawn from ${r.items.length} options.`;
  return `<div class="verdict">
    ${r.question ? `<span class="q">${esc(r.question)}</span>` : ''}
    <span class="r">${esc(r.result)}</span>
    <span class="said">${said}</span></div>`;
}

function ledgerHtml() {
  const recent = draws.slice(0, 12), counts = {};
  return `<div class="ledger"><span class="cap">The ledger</span>
    ${recent.length ? `<ol>${recent.map(d => {
      const key = (d.question || '').trim().toLowerCase();
      let again = '';
      if (key) {
        const total = draws.filter(x => (x.question || '').trim().toLowerCase() === key).length;
        counts[key] = (counts[key] || 0) + 1;
        const nth = total - counts[key] + 1;
        if (nth > 1) again = ` <span class="again">attempt ${nth}</span>`;
      }
      return `<li>${d.question ? esc(d.question) + ' — ' : ''}<b>${esc(d.result)}</b>${again}
        <br>${esc(nameOf(d.drawn_by))} · ${ago(d.created_at)}</li>`;
    }).join('')}</ol>` : `<p class="none">Nothing settled yet.</p>`}</div>`;
}

async function doDraw(btn) {
  const q = document.getElementById('d-q').value.trim().slice(0, 80);
  let items;
  if (drawMode === 'coin') {
    const a = document.getElementById('d-a').value.trim();
    const b = document.getElementById('d-b').value.trim();
    if (!a || !b) return toast('Fill in both options');
    items = [a, b];
  } else {
    items = document.getElementById('d-items').value
      .split('\n').map(s => s.trim()).filter(Boolean);
    if (items.length < 2) return toast('Give it at least two to choose from');
  }
  items = items.slice(0, 30).map(s => s.slice(0, 60));

  lastQuestion = q;
  btn.disabled = true;
  btn.textContent = drawMode === 'dictator' ? 'Appointing…' : 'Drawing…';

  const result = pick(items);
  const row = { kind: drawMode, question: q || null, items, result, drawn_by: meId };
  await new Promise(r => setTimeout(r, 750));

  draws.unshift({ ...row, created_at: new Date().toISOString() });
  stash();
  renderDraw({ ...row, items });
  enqueue(() => insert('draws', row));
}

/* ---- copying ---- */

function copyText(text, btn) {
  const done = () => {
    if (btn) { btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy', 1800); }
    else toast('Copied — paste it in the chat');
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:absolute;left:-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('Select and copy the text above'); }
  ta.remove();
}

function copyTrip(id) {
  const t = trips.find(x => x.id === id);
  const g = countIn(id), m = countMaybe(id);
  const when = fmt(t.start) + (t.end && t.end > t.start ? ` – ${fmt(t.end)}` : '');
  const bits = [`${t.destination}, ${when}`];
  if (t.meetPoint || t.meetTime) bits.push(`meet ${[t.meetPoint,t.meetTime].filter(Boolean).join(' ')}`);
  if (t.cost) bits.push(`~€${Math.round(t.cost)}`);
  bits.push(`${g} in${m ? `, ${m} maybe` : ''}`);
  copyText(bits.join(' — '));
}

function togglePast() { showPast = !showPast; render(); }

let toastTimer;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2600);
}

(async function init() {
  const app = document.getElementById('app');
  try { meId = localStorage.getItem('siena:me'); } catch (e) {}
  const hadCache = unstash();
  if (hadCache) render();
  try {
    await load();
    if (meId && !people.some(p => p.id === meId)) meId = null;
    render();
  } catch (e) {
    offline = true;
    if (hadCache) render();
    else app.innerHTML = `<div class="state err">Couldn't reach the database, and there's
      nothing saved on this device yet. Check your signal and reload.<br><br>
      <code>${esc(e.message)}</code></div>`;
  }
})();
</script>
