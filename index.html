<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where's everyone going? — Siena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#F2EEE4; --leaf:#FBF9F4; --ink:#221F1A; --muted:#6E675C;
    --faint:#9A9184; --rule:#DCD4C5; --green:#1F5F4B; --green-soft:#E4EDE7;
    --ochre:#8A6A15; --ochre-soft:#F2EBD9; --alarm:#8A2A1E;
    --display:"EB Garamond",Georgia,"Times New Roman",serif;
    --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    --data:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--body);
         font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:540px; margin:0 auto; padding:24px 20px 72px; }
  .masthead { border-bottom:1.5px solid var(--ink); padding-bottom:14px; margin-bottom:4px; }
  .masthead h1 { font-family:var(--display); font-size:34px; font-weight:500;
                 line-height:1.05; margin:0 0 6px; letter-spacing:-0.01em; }
  .masthead .sub { font-family:var(--data); font-size:11px; letter-spacing:.09em;
                   text-transform:uppercase; color:var(--muted); }
  .whoami { display:flex; justify-content:space-between; align-items:baseline;
            font-family:var(--data); font-size:11px; letter-spacing:.05em;
            color:var(--muted); padding:10px 0 22px; }
  .linkbtn { background:none; border:0; padding:0; cursor:pointer; font:inherit;
             color:var(--muted); text-decoration:underline; text-underline-offset:3px; }
  .linkbtn:hover { color:var(--ink); }
  .entry { border-top:1px solid var(--rule); padding:22px 0 20px; }
  .entry:first-of-type { border-top:0; }
  .entry-head { display:flex; gap:14px; align-items:flex-start; }
  .datemark { font-family:var(--data); font-size:11px; line-height:1.35; color:var(--muted);
              text-align:right; flex:0 0 46px; padding-top:5px; letter-spacing:.02em; }
  .datemark b { display:block; font-weight:500; font-size:15px; color:var(--ink); }
  .dest { font-family:var(--display); font-size:25px; font-weight:500; line-height:1.15; margin:0; }
  .dest .nights { font-family:var(--data); font-size:10px; letter-spacing:.08em;
                  text-transform:uppercase; color:var(--ochre); vertical-align:5px; margin-left:7px; }
  .meta { font-family:var(--data); font-size:11.5px; color:var(--muted); margin-top:5px; }
  .meta span + span::before { content:" · "; color:var(--faint); }
  .notes { font-size:14px; color:var(--muted); margin:9px 0 0; }
  .banner { display:flex; gap:2px; height:22px; margin:15px 0 9px; }
  .banner i { flex:1 1 auto; min-width:4px; max-width:15px; border-radius:1px; }
  .banner.empty { border-bottom:1px dashed var(--rule); height:0; margin:18px 0 11px; }
  .roll { font-size:13.5px; line-height:1.5; }
  .roll b { font-weight:500; }
  .roll .maybe { color:var(--muted); }
  .roll .nobody { color:var(--faint); font-style:italic; }
  .threshold { font-family:var(--data); font-size:11px; letter-spacing:.03em; margin-top:7px;
               display:inline-block; padding:3px 9px; border-radius:2px; }
  .threshold.short { background:var(--ochre-soft); color:var(--ochre); }
  .threshold.met { background:var(--green-soft); color:var(--green); }
  .actions { display:flex; gap:8px; margin-top:15px; }
  button { font-family:var(--body); font-size:14px; cursor:pointer; border:1px solid var(--rule);
           background:var(--leaf); color:var(--ink); border-radius:3px; padding:11px 12px;
           min-height:44px; transition:border-color .12s, background .12s; }
  button:hover { border-color:var(--muted); }
  button:active { transform:translateY(1px); }
  button:focus-visible { outline:2px solid var(--green); outline-offset:2px; }
  button[disabled] { opacity:.55; cursor:default; }
  .actions button { flex:1; }
  .actions button.on { background:var(--green); border-color:var(--green); color:#fff; }
  .actions button.on.maybe { background:var(--ochre); border-color:var(--ochre); }
  .actions .ghost { flex:0 0 auto; padding:11px 13px; color:var(--muted); }
  .newbtn { width:100%; margin-top:30px; padding:15px; font-family:var(--display);
            font-size:18px; background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .newbtn:hover { background:#3A342C; border-color:#3A342C; }
  .sheet { position:fixed; inset:0; background:rgba(34,31,26,.4); display:flex;
           align-items:flex-end; justify-content:center; z-index:20; }
  .sheet-inner { background:var(--paper); width:100%; max-width:540px; border-radius:6px 6px 0 0;
                 padding:22px 20px 26px; max-height:92vh; overflow-y:auto; }
  .sheet h2 { font-family:var(--display); font-size:25px; font-weight:500; margin:0 0 18px; }
  label { display:block; font-family:var(--data); font-size:10.5px; letter-spacing:.09em;
          text-transform:uppercase; color:var(--muted); margin:15px 0 5px; }
  input, select, textarea { width:100%; font-family:var(--body); font-size:16px; color:var(--ink);
    background:var(--leaf); border:1px solid var(--rule); border-radius:3px;
    padding:11px 12px; min-height:44px; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--green);
    outline-offset:-1px; border-color:var(--green); }
  textarea { min-height:66px; resize:vertical; line-height:1.5; }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  .hint { font-size:12.5px; color:var(--muted); margin:6px 0 0; }
  .gate p { color:var(--muted); font-size:14px; margin:0 0 20px; }
  .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:3px;
    font-size:13.5px; z-index:40; font-family:var(--data); letter-spacing:.02em;
    max-width:90%; text-align:center; }
  .state { padding:40px 0; color:var(--muted); font-size:14px; }
  .state.err { color:var(--alarm); }
  .state code { font-family:var(--data); font-size:12.5px; background:var(--leaf);
                padding:2px 5px; border-radius:2px; }
  .empty-note { border-top:1px solid var(--rule); padding-top:24px;
                font-family:var(--display); font-size:19px; color:var(--muted); }
  .past-toggle { margin-top:34px; text-align:center; }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <h1>Where's everyone going?</h1>
    <div class="sub">Siena &middot; summer trips</div>
  </div>
  <div id="app"><div class="state">Opening the ledger…</div></div>
</div>

<script>
/* ==========================================================================
   PASTE YOUR TWO SUPABASE VALUES HERE.

   Both are on Project Settings > API in your Supabase dashboard.
   Use the PUBLIC key — it may be labelled "anon public" or "publishable".
   NEVER paste the one marked "secret" or "service_role". That key ignores
   all access rules, and everything in this file is readable by anyone.
   ========================================================================== */
const SUPABASE_URL = 'https://zmlstgxvujxrwctqwjlw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_i9xakqu9DvL5XMxJfiRExA_jayrBZWE';


const STRIPES = ['#1F5F4B','#7A3B2E','#2C4C6B','#8A6A15','#4A3B6B','#5B6B24','#A34E2B','#3F6B6B'];
let people = [], trips = [], rsvps = [], meId = null, showPast = false, busy = false;

/* ---- the only code that talks to the outside world ---- */

const HEAD = () => ({
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json'
});

async function api(path, options = {}) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...options,
    headers: { ...HEAD(), ...(options.headers || {}) }
  });
  if (!res.ok) {
    const detail = await res.text();
    throw new Error(res.status + ' ' + detail.slice(0, 200));
  }
  return res.status === 204 ? null : res.json();
}

async function load() {
  const [pp, tt, rr] = await Promise.all([
    api('people?select=*'),
    api('trips?select=*'),
    api('rsvps?select=*')
  ]);
  people = pp;
  trips = tt.map(t => ({
    id: t.id, destination: t.destination, start: t.start_date, end: t.end_date,
    meetPoint: t.meet_point, meetTime: t.meet_time, cost: t.cost,
    minPeople: t.min_people, notes: t.notes, proposedBy: t.proposed_by
  }));
  rsvps = rr.map(r => ({ tripId: r.trip_id, personId: r.person_id, status: r.status }));
}

const insert = (table, row, prefer = 'return=representation') =>
  api(table, { method: 'POST', headers: { Prefer: prefer }, body: JSON.stringify(row) });

const upsertRsvp = row =>
  api('rsvps', {
    method: 'POST',
    headers: { Prefer: 'resolution=merge-duplicates,return=representation' },
    body: JSON.stringify(row)
  });

const removeRsvp = (tripId, personId) =>
  api(`rsvps?trip_id=eq.${tripId}&person_id=eq.${personId}`, { method: 'DELETE' });

const removeTripRow = tripId =>
  api(`trips?id=eq.${tripId}`, { method: 'DELETE' });

/* ---- everything below is plain browser code ---- */

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function stripe(id) {
  let h = 0;
  for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return STRIPES[h % STRIPES.length];
}
const nameOf = id => (people.find(p => p.id === id) || {}).name || 'Someone';
const today = () => new Date().toISOString().slice(0, 10);

function fmt(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
}
function dateMark(iso) {
  const d = new Date(iso + 'T12:00:00');
  return `<span class="datemark">${d.toLocaleDateString('en-GB',{weekday:'short'})}<b>${d.getDate()}</b>${d.toLocaleDateString('en-GB',{month:'short'})}</span>`;
}
function nightsLabel(t) {
  if (!t.end || t.end <= t.start) return '';
  const n = Math.round((new Date(t.end) - new Date(t.start)) / 86400000);
  return `<span class="nights">${n} night${n > 1 ? 's' : ''}</span>`;
}
function roll(list, verb) {
  const names = list.map(r => nameOf(r.personId));
  if (names.length === 1) return `<b>${esc(names[0])}</b> is ${verb}`;
  if (names.length === 2) return `<b>${esc(names[0])}</b> and <b>${esc(names[1])}</b> are ${verb}`;
  return `<b>${esc(names[0])}</b> and ${names.length - 1} others are ${verb}`;
}

function render() {
  const app = document.getElementById('app');
  if (!meId) return renderGate(app);

  const t0 = today();
  const list = trips
    .filter(t => showPast ? (t.end || t.start) < t0 : (t.end || t.start) >= t0)
    .sort((a, b) => showPast ? String(b.start).localeCompare(a.start)
                             : String(a.start).localeCompare(b.start));

  let html = `<div class="whoami"><span>You are ${esc(nameOf(meId))}</span>
    <button class="linkbtn" onclick="forget()">not you?</button></div>`;

  if (!list.length) {
    html += showPast
      ? `<div class="empty-note">Nothing behind you yet.</div>`
      : `<div class="empty-note">No trips proposed yet. Somebody has to go first — it may as well be you.</div>`;
  }

  for (const t of list) {
    const mine  = rsvps.filter(r => r.tripId === t.id);
    const going = mine.filter(r => r.status === 'in');
    const maybe = mine.filter(r => r.status === 'maybe');
    const my    = mine.find(r => r.personId === meId);

    const meta = [];
    if (t.meetPoint || t.meetTime)
      meta.push(`<span>${esc([t.meetPoint, t.meetTime].filter(Boolean).join(', '))}</span>`);
    if (t.cost) meta.push(`<span>~&euro;${Math.round(t.cost)}</span>`);
    meta.push(`<span>by ${esc(nameOf(t.proposedBy))}</span>`);

    let thresh = '';
    if (t.minPeople) {
      thresh = going.length >= t.minPeople
        ? `<div class="threshold met">${t.minPeople} needed — confirmed</div>`
        : `<div class="threshold short">${t.minPeople - going.length} more needed to book</div>`;
    }

    html += `<div class="entry">
      <div class="entry-head">
        ${dateMark(t.start)}
        <div style="flex:1;min-width:0">
          <h3 class="dest">${esc(t.destination)}${nightsLabel(t)}</h3>
          <div class="meta">${meta.join('')}</div>
        </div>
      </div>
      ${t.notes ? `<p class="notes">${esc(t.notes)}</p>` : ''}
      ${going.length
        ? `<div class="banner">${going.map(r => `<i style="background:${stripe(r.personId)}" title="${esc(nameOf(r.personId))}"></i>`).join('')}</div>`
        : `<div class="banner empty"></div>`}
      <div class="roll">${going.length
        ? roll(going, 'in')
        : `<span class="nobody">Nobody signed up yet</span>`}${
        maybe.length ? `<span class="maybe">, ${roll(maybe,'maybe').replace(/<\/?b>/g,'')}</span>` : ''}</div>
      ${thresh}
      <div class="actions">
        <button class="${my && my.status === 'in' ? 'on' : ''}" onclick="rsvp('${t.id}','in')">I'm in</button>
        <button class="${my && my.status === 'maybe' ? 'on maybe' : ''}" onclick="rsvp('${t.id}','maybe')">Maybe</button>
        <button class="ghost" onclick="copyTrip('${t.id}')">Copy</button>
        ${t.proposedBy === meId ? `<button class="ghost" onclick="dropTrip('${t.id}')" aria-label="Delete this trip">&times;</button>` : ''}
      </div>
    </div>`;
  }

  html += `<button class="newbtn" onclick="openForm()">Propose a trip</button>
    <div class="past-toggle"><button class="linkbtn" onclick="togglePast()">
      ${showPast ? 'back to upcoming' : 'see past trips'}</button></div>`;

  app.innerHTML = html;
}

function renderGate(app) {
  const opts = people.slice().sort((a,b) => String(a.name).localeCompare(b.name))
    .map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  app.innerHTML = `<div class="gate">
    <p>${people.length
      ? "Pick your name so the board knows who's signing up. It only asks once."
      : "You're the first one here. Add your name to start the list."}</p>
    ${people.length ? `<label for="pick">Choose your name</label>
      <select id="pick"><option value="">—</option>${opts}
        <option value="__new">I'm not on this list</option></select>` : ''}
    <div id="newname" style="${people.length ? 'display:none' : ''}">
      <label for="nm">First name and last initial</label>
      <input id="nm" placeholder="Jake M" autocomplete="off">
      <p class="hint">Everyone after you picks from this list, so keep it recognisable.</p>
    </div>
    <button class="newbtn" onclick="claim(this)">Continue</button>
  </div>`;
  const pick = document.getElementById('pick');
  if (pick) pick.onchange = () => {
    document.getElementById('newname').style.display = pick.value === '__new' ? 'block' : 'none';
  };
}

async function claim(btn) {
  const pick = document.getElementById('pick');
  const chosen = pick ? pick.value : '__new';
  if (!chosen) return toast('Pick a name first');

  if (chosen !== '__new') {
    meId = chosen; remember(meId); return render();
  }

  const nm = document.getElementById('nm').value.trim();
  if (!nm) return toast('Type your name first');

  const dupe = people.find(p => String(p.name).toLowerCase() === nm.toLowerCase());
  if (dupe) { meId = dupe.id; remember(meId); return render(); }

  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const [row] = await insert('people', { name: nm.slice(0, 60) });
    await load();
    meId = row.id; remember(meId);
    render();
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Continue';
    toast("Couldn't save that — try again");
  }
}

function remember(id) { try { localStorage.setItem('siena:me', id); } catch (e) {} }
function forget() {
  try { localStorage.removeItem('siena:me'); } catch (e) {}
  meId = null; render();
}

async function rsvp(tripId, status) {
  if (busy) return;
  busy = true;
  document.querySelectorAll('.actions button').forEach(b => b.disabled = true);
  try {
    const mine = rsvps.find(r => r.tripId === tripId && r.personId === meId);
    if (mine && mine.status === status) await removeRsvp(tripId, meId);
    else await upsertRsvp({ trip_id: tripId, person_id: meId, status,
                            updated_at: new Date().toISOString() });
    await load();
    render();
  } catch (e) {
    toast("Couldn't save — check your signal");
    document.querySelectorAll('.actions button').forEach(b => b.disabled = false);
  } finally { busy = false; }
}

async function dropTrip(tripId) {
  if (!confirm('Delete this trip for everyone?')) return;
  try {
    await removeTripRow(tripId);
    await load();
    render();
  } catch (e) { toast("Couldn't delete — try again"); }
}

function openForm() {
  const el = document.createElement('div');
  el.className = 'sheet';
  el.onclick = e => { if (e.target === el) el.remove(); };
  el.innerHTML = `<div class="sheet-inner">
    <h2>Propose a trip</h2>
    <label for="f-dest">Where</label>
    <input id="f-dest" placeholder="Florence" autocomplete="off">
    <div class="row">
      <div><label for="f-start">Leaving</label><input id="f-start" type="date" value="${today()}"></div>
      <div><label for="f-end">Back</label><input id="f-end" type="date"></div>
    </div>
    <p class="hint">Leave "back" empty for a day trip.</p>
    <div class="row">
      <div><label for="f-point">Meet at</label><input id="f-point" placeholder="Piazza Gramsci"></div>
      <div><label for="f-time">Time</label><input id="f-time" placeholder="07:40"></div>
    </div>
    <div class="row">
      <div><label for="f-cost">Rough cost &euro;</label><input id="f-cost" type="number" min="0" placeholder="18"></div>
      <div><label for="f-min">Min. people</label><input id="f-min" type="number" min="0" placeholder="6"></div>
    </div>
    <label for="f-notes">Anything else</label>
    <textarea id="f-notes" placeholder="Hostel deposit due Monday"></textarea>
    <button class="newbtn" onclick="saveTrip(this)">Add to the board</button>
  </div>`;
  document.body.appendChild(el);
  document.getElementById('f-dest').focus();
}

async function saveTrip(btn) {
  const v = id => document.getElementById(id).value.trim();
  if (!v('f-dest')) return toast('Where are you going?');
  if (!v('f-start')) return toast('Pick a date');

  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const [row] = await insert('trips', {
      destination: v('f-dest').slice(0, 80),
      start_date:  v('f-start'),
      end_date:    v('f-end') || null,
      meet_point:  v('f-point') || null,
      meet_time:   v('f-time') || null,
      cost:        v('f-cost') ? Number(v('f-cost')) : null,
      min_people:  v('f-min') ? Number(v('f-min')) : null,
      notes:       v('f-notes') ? v('f-notes').slice(0, 400) : null,
      proposed_by: meId
    });
    await upsertRsvp({ trip_id: row.id, person_id: meId, status: 'in',
                       updated_at: new Date().toISOString() });
    await load();
    document.querySelector('.sheet').remove();
    showPast = false;
    render();
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Add to the board';
    toast("Couldn't save — try again");
  }
}

function copyTrip(id) {
  const t = trips.find(x => x.id === id);
  const mine = rsvps.filter(r => r.tripId === id);
  const going = mine.filter(r => r.status === 'in').length;
  const maybe = mine.filter(r => r.status === 'maybe').length;
  const when = fmt(t.start) + (t.end && t.end > t.start ? ` – ${fmt(t.end)}` : '');
  const bits = [`${t.destination}, ${when}`];
  if (t.meetPoint || t.meetTime) bits.push(`meet ${[t.meetPoint,t.meetTime].filter(Boolean).join(' ')}`);
  if (t.cost) bits.push(`~€${Math.round(t.cost)}`);
  bits.push(`${going} in${maybe ? `, ${maybe} maybe` : ''}`);
  const text = bits.join(' — ');
  const done = () => toast('Copied — paste it in the chat');

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:absolute;left:-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast(text); }
  ta.remove();
}

function togglePast() { showPast = !showPast; render(); }

let toastTimer;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2600);
}

(async function init() {
  const app = document.getElementById('app');
  if (SUPABASE_URL.startsWith('PASTE') || SUPABASE_KEY.startsWith('PASTE')) {
    app.innerHTML = `<div class="state err">Not connected yet. Open this file and fill in
      <code>SUPABASE_URL</code> and <code>SUPABASE_KEY</code> near the top of the script.</div>`;
    return;
  }
  try {
    await load();
    try { meId = localStorage.getItem('siena:me'); } catch (e) {}
    if (meId && !people.some(p => p.id === meId)) meId = null;
    render();
  } catch (e) {
    app.innerHTML = `<div class="state err">Couldn't reach the database.
      Check the URL and key, and that you ran the SQL setup.<br><br>
      <code>${esc(e.message)}</code></div>`;
  }
})();
</script>
