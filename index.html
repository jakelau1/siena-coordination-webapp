<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where's everyone going? — Siena</title>
<script>
  try { const t = localStorage.getItem('siena:theme');
        if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#F2EEE4; --leaf:#FBF9F4; --ink:#221F1A; --muted:#6E675C;
    --faint:#9A9184; --rule:#DCD4C5;
    --green:#1F5F4B; --green-soft:#E4EDE7;
    --ochre:#8A6A15; --ochre-soft:#F2EBD9;
    --alarm:#8A2A1E; --alarm-soft:#F5E3DF;
    --veil:rgba(34,31,26,.4);
    --display:"EB Garamond",Georgia,"Times New Roman",serif;
    --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    --data:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#191713; --leaf:#221F19; --ink:#EDE7DA; --muted:#9C9384;
      --faint:#6B6355; --rule:#372F26;
      --green:#4FA383; --green-soft:#1B3128;
      --ochre:#C9A24A; --ochre-soft:#332A16;
      --alarm:#D9806E; --alarm-soft:#3B211C;
      --veil:rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --paper:#191713; --leaf:#221F19; --ink:#EDE7DA; --muted:#9C9384;
    --faint:#6B6355; --rule:#372F26;
    --green:#4FA383; --green-soft:#1B3128;
    --ochre:#C9A24A; --ochre-soft:#332A16;
    --alarm:#D9806E; --alarm-soft:#3B211C;
    --veil:rgba(0,0,0,.6);
  }

  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--body);
         font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:540px; margin:0 auto; padding:24px 20px 72px; }
  .masthead { border-bottom:1.5px solid var(--ink); padding-bottom:14px; margin-bottom:4px; }
  .masthead h1 { font-family:var(--display); font-size:34px; font-weight:500;
                 line-height:1.05; margin:0 0 6px; letter-spacing:-0.01em; }
  .masthead .sub { font-family:var(--data); font-size:11px; letter-spacing:.09em;
                   text-transform:uppercase; color:var(--muted); }
  .whoami { display:flex; justify-content:space-between; align-items:baseline; gap:10px;
            font-family:var(--data); font-size:11px; letter-spacing:.05em;
            color:var(--muted); padding:10px 0 18px; flex-wrap:wrap; }
  .whoami .right { display:flex; gap:13px; flex:0 0 auto; }
  .linkbtn { background:none; border:0; padding:0; cursor:pointer; font:inherit;
             color:var(--muted); text-decoration:underline; text-underline-offset:3px;
             min-height:0; border-radius:0; }
  .linkbtn:hover { color:var(--ink); border-color:transparent; }

  .dossier { border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);
             padding:13px 0; margin-bottom:6px; font-family:var(--data); font-size:12px;
             line-height:1.75; letter-spacing:.01em; color:var(--muted); }
  .dossier .cap { font-size:10px; letter-spacing:.11em; text-transform:uppercase;
                  color:var(--faint); display:block; margin-bottom:4px; }
  .dossier b { color:var(--ink); font-weight:500; }
  .dossier .warn { color:var(--alarm); }

  .stale { font-family:var(--data); font-size:10.5px; letter-spacing:.05em;
           color:var(--ochre); background:var(--ochre-soft); padding:7px 11px;
           border-radius:2px; margin-bottom:16px; }

  .entry { border-top:1px solid var(--rule); padding:22px 0 20px; }
  .entry-head { display:flex; gap:14px; align-items:flex-start; }
  .datemark { font-family:var(--data); font-size:11px; line-height:1.35; color:var(--muted);
              text-align:right; flex:0 0 46px; padding-top:5px; letter-spacing:.02em; }
  .datemark b { display:block; font-weight:500; font-size:15px; color:var(--ink); }
  .dest { font-family:var(--display); font-size:25px; font-weight:500; line-height:1.15; margin:0; }
  .dest .nights { font-family:var(--data); font-size:10px; letter-spacing:.08em;
                  text-transform:uppercase; color:var(--ochre); vertical-align:5px; margin-left:7px; }
  .meta { font-family:var(--data); font-size:11.5px; color:var(--muted); margin-top:5px; }
  .meta span + span::before { content:" · "; color:var(--faint); }
  .notes { font-size:14px; color:var(--muted); margin:9px 0 0; }

  .banner { display:flex; gap:2px; height:22px; margin:15px 0 9px; }
  .banner i { flex:1 1 auto; min-width:4px; max-width:15px; border-radius:1px; }
  .banner i.in { background:var(--green); }
  .banner i.mb { background:var(--ochre); }
  .banner.empty { border-bottom:1px dashed var(--rule); height:0; margin:18px 0 11px; }

  .roll { font-size:13.5px; line-height:1.5; }
  .roll b { font-weight:500; }
  .roll .maybe { color:var(--muted); }
  .roll .nobody { color:var(--faint); font-style:italic; }
  .tag { font-family:var(--data); font-size:11px; letter-spacing:.03em; margin-top:7px;
         display:block; width:fit-content; padding:3px 9px; border-radius:2px; }
  .tag.short { background:var(--ochre-soft); color:var(--ochre); }
  .tag.met   { background:var(--green-soft); color:var(--green); }
  .tag.clash { background:var(--alarm-soft); color:var(--alarm); }
  .tag.edit  { background:var(--ochre-soft); color:var(--ochre); max-width:100%;
               white-space:normal; line-height:1.5; }

  .actions { display:flex; gap:8px; margin-top:15px; }
  button { font-family:var(--body); font-size:14px; cursor:pointer; border:1px solid var(--rule);
           background:var(--leaf); color:var(--ink); border-radius:3px; padding:11px 12px;
           min-height:44px; transition:border-color .12s, background .12s; }
  button:hover { border-color:var(--muted); }
  button:active { transform:translateY(1px); }
  button:focus-visible { outline:2px solid var(--green); outline-offset:2px; }
  button[disabled] { opacity:.55; cursor:default; }
  .actions button { flex:1; }
  .actions button.on { background:var(--green); border-color:var(--green); color:var(--paper); }
  .actions button.on.maybe { background:var(--ochre); border-color:var(--ochre); color:var(--paper); }
  .actions .ghost { flex:0 0 auto; padding:11px 12px; color:var(--muted); }

  .newbtn { width:100%; margin-top:30px; padding:15px; font-family:var(--display);
            font-size:18px; background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .newbtn:hover { background:var(--ink); border-color:var(--ink); opacity:.88; }
  .altbtn { width:100%; margin-top:10px; padding:13px; font-family:var(--display);
            font-size:16px; background:transparent; color:var(--ink); border-color:var(--ink); }

  .sheet { position:fixed; inset:0; background:var(--veil); display:flex;
           align-items:flex-end; justify-content:center; z-index:20; }
  .sheet-inner { background:var(--paper); width:100%; max-width:540px; border-radius:6px 6px 0 0;
                 padding:22px 20px 26px; max-height:92vh; overflow-y:auto; }
  .sheet h2 { font-family:var(--display); font-size:25px; font-weight:500; margin:0 0 4px; }
  .sheet .lede { font-size:13.5px; color:var(--muted); margin:0 0 16px; }

  label { display:block; font-family:var(--data); font-size:10.5px; letter-spacing:.09em;
          text-transform:uppercase; color:var(--muted); margin:15px 0 5px; }
  input, select, textarea { width:100%; font-family:var(--body); font-size:16px; color:var(--ink);
    background:var(--leaf); border:1px solid var(--rule); border-radius:3px;
    padding:11px 12px; min-height:44px; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--green);
    outline-offset:-1px; border-color:var(--green); }
  textarea { min-height:66px; resize:vertical; line-height:1.5; }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  .hint { font-size:12.5px; color:var(--muted); margin:6px 0 0; }
  .gate p { color:var(--muted); font-size:14px; margin:0 0 20px; }

  .modes { display:flex; gap:6px; margin:4px 0 10px; }
  .modes button { flex:1; font-size:13px; padding:10px 6px; }
  .modes button.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }

  .verdict { border-top:1px solid var(--ink); border-bottom:1px solid var(--ink);
             padding:22px 0; margin:18px 0 4px; text-align:center; }
  .verdict .q { font-family:var(--data); font-size:10.5px; letter-spacing:.1em;
                text-transform:uppercase; color:var(--muted); display:block; margin-bottom:8px; }
  .verdict .r { font-family:var(--display); font-size:32px; line-height:1.15;
                font-weight:500; display:block; }
  .verdict .said { font-size:13px; color:var(--muted); margin-top:9px; display:block;
                   font-style:italic; }
  .verdict.waiting .r { color:var(--faint); }

  .ledger { margin-top:22px; border-top:1px solid var(--rule); padding-top:14px; }
  .ledger .cap { font-family:var(--data); font-size:10px; letter-spacing:.11em;
                 text-transform:uppercase; color:var(--faint); display:block; margin-bottom:9px; }
  .ledger ol { list-style:none; margin:0; padding:0; }
  .ledger li { font-family:var(--data); font-size:11.5px; line-height:1.6; color:var(--muted);
               padding:6px 0; border-top:1px solid var(--rule); }
  .ledger li:first-child { border-top:0; }
  .ledger b { color:var(--ink); font-weight:500; }
  .ledger .again { color:var(--alarm); }
  .ledger .none { color:var(--faint); font-style:italic; font-family:var(--body); font-size:13px; }

  .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:3px;
    font-size:13.5px; z-index:40; font-family:var(--data); letter-spacing:.02em;
    max-width:90%; text-align:center; }
  .state { padding:40px 0; color:var(--muted); font-size:14px; }
  .state.err { color:var(--alarm); }
  .state code { font-family:var(--data); font-size:12.5px; background:var(--leaf);
                padding:2px 5px; border-radius:2px; }
  .empty-note { border-top:1px solid var(--rule); padding-top:24px;
                font-family:var(--display); font-size:19px; color:var(--muted); }
  .past-toggle { margin-top:34px; text-align:center; }
  @media (prefers-reduced-motion:reduce) {
    * { transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <h1>Where's everyone going?</h1>
    <div class="sub">Siena &middot; summer trips</div>
  </div>
  <div id="app"><div class="state">Opening the ledger…</div></div>
</div>

<script>
const SUPABASE_URL = 'https://zmlstgxvujxrwctqwjlw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_i9xakqu9DvL5XMxJfiRExA_jayrBZWE';
const CACHE = 'siena:board';

let people = [], trips = [], rsvps = [], draws = [], meId = null;
let showPast = false, lastSync = null, offline = false;

/* ---- network ---- */

async function api(path, options = {}) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...options,
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      ...(options.headers || {})
    }
  });
  if (!res.ok) throw new Error(res.status + ' ' + (await res.text()).slice(0, 200));
  return res.status === 204 ? null : res.json();
}

const shapeTrip = t => ({
  id: t.id, destination: t.destination, start: t.start_date, end: t.end_date,
  meetPoint: t.meet_point, meetTime: t.meet_time, cost: t.cost,
  minPeople: t.min_people, notes: t.notes, proposedBy: t.proposed_by,
  lastChange: t.last_change, updatedAt: t.updated_at
});

async function load() {
  const [pp, tt, rr, dd] = await Promise.all([
    api('people?select=*'),
    api('trips?select=*'),
    api('rsvps?select=*'),
    api('draws?select=*&order=created_at.desc&limit=40')
  ]);
  people = pp;
  trips  = tt.map(shapeTrip);
  rsvps  = rr.map(r => ({ tripId: r.trip_id, personId: r.person_id, status: r.status }));
  draws  = dd;
  lastSync = Date.now();
  offline = false;
  stash();
}

const insert = (table, row) =>
  api(table, { method:'POST', headers:{ Prefer:'return=representation' }, body: JSON.stringify(row) });

const patch = (table, filter, row) =>
  api(`${table}?${filter}`, { method:'PATCH', headers:{ Prefer:'return=representation' },
                              body: JSON.stringify(row) });

const upsertRsvp = row =>
  api('rsvps', { method:'POST',
    headers:{ Prefer:'resolution=merge-duplicates,return=representation' },
    body: JSON.stringify(row) });

const removeRsvp = (tripId, personId) =>
  api(`rsvps?trip_id=eq.${tripId}&person_id=eq.${personId}`, { method:'DELETE' });

/* ---- cache ---- */

function stash() {
  try { localStorage.setItem(CACHE,
    JSON.stringify({ people, trips, rsvps, draws, at: lastSync })); } catch (e) {}
}
function unstash() {
  try {
    const raw = localStorage.getItem(CACHE);
    if (!raw) return false;
    const c = JSON.parse(raw);
    people = c.people || []; trips = c.trips || [];
    rsvps = c.rsvps || []; draws = c.draws || [];
    lastSync = c.at || null;
    return true;
  } catch (e) { return false; }
}

let queue = Promise.resolve();
function enqueue(fn) {
  queue = queue.then(fn).catch(async () => {
    toast('Not saved — reloading');
    try { await load(); } catch (e) { offline = true; }
    render();
  });
}

/* ---- helpers ---- */

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const nameOf = id => (people.find(p => p.id === id) || {}).name || 'Someone';
const today = () => new Date().toISOString().slice(0, 10);
const endOf = t => t.end || t.start;

function isDark() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t) return t === 'dark';
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function toggleTheme() {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('siena:theme', next); } catch (e) {}
  render();
}

function fmt(iso) {
  if (!iso) return '';
  return new Date(iso + 'T12:00:00')
    .toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
}
function dateMark(iso) {
  const d = new Date(iso + 'T12:00:00');
  return `<span class="datemark">${d.toLocaleDateString('en-GB',{weekday:'short'})}<b>${d.getDate()}</b>${d.toLocaleDateString('en-GB',{month:'short'})}</span>`;
}
function nightsLabel(t) {
  if (!t.end || t.end <= t.start) return '';
  const n = Math.round((new Date(t.end) - new Date(t.start)) / 86400000);
  return `<span class="nights">${n} night${n > 1 ? 's' : ''}</span>`;
}
function daysAway(iso) {
  const n = Math.round((new Date(iso + 'T12:00:00') - new Date(today() + 'T12:00:00')) / 86400000);
  if (n <= 0) return 'today';
  if (n === 1) return 'tomorrow';
  return `in ${n} days`;
}
function ago(ts) {
  if (!ts) return 'never';
  const m = Math.round((Date.now() - (typeof ts === 'number' ? ts : Date.parse(ts))) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h} hr ago`;
  return `${Math.round(h / 24)} d ago`;
}
function roll(list, verb) {
  const names = list.map(r => nameOf(r.personId));
  if (names.length === 1) return `<b>${esc(names[0])}</b> is ${verb}`;
  if (names.length === 2) return `<b>${esc(names[0])}</b> and <b>${esc(names[1])}</b> are ${verb}`;
  return `<b>${esc(names[0])}</b> and ${names.length - 1} others are ${verb}`;
}

const overlap = (a, b) => a.start <= endOf(b) && b.start <= endOf(a);
function myTrips() {
  const ids = rsvps.filter(r => r.personId === meId && r.status === 'in').map(r => r.tripId);
  return trips.filter(t => ids.includes(t.id));
}
const clashesFor = trip => myTrips().filter(o => o.id !== trip.id && overlap(trip, o));

/* fair draw — crypto rather than Math.random, since the whole point is being unarguable */
function pick(items) {
  const n = items.length;
  const buf = new Uint32Array(1);
  const limit = Math.floor(4294967296 / n) * n;
  let v;
  do { crypto.getRandomValues(buf); v = buf[0]; } while (v >= limit);
  return items[v % n];
}

/* ---- rendering ---- */

function dossier() {
  const t0 = today();
  const mine = myTrips().filter(t => endOf(t) >= t0)
                        .sort((a, b) => a.start.localeCompare(b.start));
  if (!mine.length) return '';
  const spend = mine.reduce((s, t) => s + (Number(t.cost) || 0), 0);
  const next = mine[0];
  const clashing = mine.filter(t => clashesFor(t).length).length;

  let l = `<span class="cap">Your ledger</span>In for <b>${mine.length}</b> trip${mine.length > 1 ? 's' : ''}`;
  if (spend > 0) l += ` &middot; <b>&euro;${Math.round(spend)}</b> committed`;
  l += `<br>Next: <b>${esc(next.destination)}</b>, ${fmt(next.start)} — ${daysAway(next.start)}`;
  if (clashing) l += `<br><span class="warn">${clashing === 2
    ? 'Two of your trips overlap' : `${clashing} of your trips overlap`}</span>`;
  return `<div class="dossier">${l}</div>`;
}

function render() {
  const app = document.getElementById('app');
  if (!meId) return renderGate(app);

  const t0 = today();
  const list = trips
    .filter(t => showPast ? endOf(t) < t0 : endOf(t) >= t0)
    .sort((a, b) => showPast ? String(b.start).localeCompare(a.start)
                             : String(a.start).localeCompare(b.start));

  let html = `<div class="whoami">
      <span>You are ${esc(nameOf(meId))}</span>
      <span class="right">
        <button class="linkbtn" onclick="toggleTheme()">${isDark() ? 'light' : 'dark'}</button>
        <button class="linkbtn" onclick="refresh(this)">refresh</button>
        <button class="linkbtn" onclick="forget()">not you?</button>
      </span>
    </div>`;

  if (offline) html += `<div class="stale">No signal — showing the board as of ${ago(lastSync)}.</div>`;
  if (!showPast) html += dossier();

  if (!list.length) {
    html += showPast
      ? `<div class="empty-note">Nothing behind you yet.</div>`
      : `<div class="empty-note">No trips proposed yet. Somebody has to go first — it may as well be you.</div>`;
  }

  for (const t of list) {
    const mine  = rsvps.filter(r => r.tripId === t.id);
    const going = mine.filter(r => r.status === 'in');
    const maybe = mine.filter(r => r.status === 'maybe');
    const my    = mine.find(r => r.personId === meId);

    const meta = [];
    if (t.meetPoint || t.meetTime)
      meta.push(`<span>${esc([t.meetPoint, t.meetTime].filter(Boolean).join(', '))}</span>`);
    if (t.cost) meta.push(`<span>~&euro;${Math.round(t.cost)}</span>`);
    meta.push(`<span>by ${esc(nameOf(t.proposedBy))}</span>`);

    let tags = '';
    if (t.minPeople) {
      tags += going.length >= t.minPeople
        ? `<span class="tag met">${t.minPeople} needed — confirmed</span>`
        : `<span class="tag short">${t.minPeople - going.length} more needed to book</span>`;
    }
    if (t.lastChange && endOf(t) >= t0) {
      tags += `<span class="tag edit">Changed ${ago(t.updatedAt)}: ${esc(t.lastChange)}</span>`;
    }
    if (my && my.status === 'in') {
      const clash = clashesFor(t);
      if (clash.length) tags += `<span class="tag clash">Overlaps ${
        clash.map(c => esc(c.destination)).join(' and ')}</span>`;
    }

    const blocks = [
      ...going.map(r => `<i class="in" title="${esc(nameOf(r.personId))} — in"></i>`),
      ...maybe.map(r => `<i class="mb" title="${esc(nameOf(r.personId))} — maybe"></i>`)
    ].join('');

    html += `<div class="entry">
      <div class="entry-head">
        ${dateMark(t.start)}
        <div style="flex:1;min-width:0">
          <h3 class="dest">${esc(t.destination)}${nightsLabel(t)}</h3>
          <div class="meta">${meta.join('')}</div>
        </div>
      </div>
      ${t.notes ? `<p class="notes">${esc(t.notes)}</p>` : ''}
      ${blocks ? `<div class="banner">${blocks}</div>` : `<div class="banner empty"></div>`}
      <div class="roll">${going.length
        ? roll(going, 'in')
        : `<span class="nobody">Nobody signed up yet</span>`}${
        maybe.length ? `<span class="maybe">, ${roll(maybe,'maybe').replace(/<\/?b>/g,'')}</span>` : ''}</div>
      ${tags}
      <div class="actions">
        <button class="${my && my.status === 'in' ? 'on' : ''}" onclick="rsvp('${t.id}','in')">I'm in</button>
        <button class="${my && my.status === 'maybe' ? 'on maybe' : ''}" onclick="rsvp('${t.id}','maybe')">Maybe</button>
        <button class="ghost" onclick="copyTrip('${t.id}')">Copy</button>
        ${t.proposedBy === meId
          ? `<button class="ghost" onclick="openForm('${t.id}')" aria-label="Edit this trip">Edit</button>
             <button class="ghost" onclick="dropTrip('${t.id}')" aria-label="Delete this trip">&times;</button>`
          : ''}
      </div>
    </div>`;
  }

  html += `<button class="newbtn" onclick="openForm()">Propose a trip</button>
    <button class="altbtn" onclick="openDraw()">Settle something</button>
    <div class="past-toggle"><button class="linkbtn" onclick="togglePast()">
      ${showPast ? 'back to upcoming' : 'see past trips'}</button></div>`;

  app.innerHTML = html;
}

function renderGate(app) {
  const opts = people.slice().sort((a,b) => String(a.name).localeCompare(b.name))
    .map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  app.innerHTML = `<div class="gate">
    <p>${people.length
      ? "Pick your name so the board knows who's signing up. It only asks once."
      : "You're the first one here. Add your name to start the list."}</p>
    ${people.length ? `<label for="pick">Choose your name</label>
      <select id="pick"><option value="">—</option>${opts}
        <option value="__new">I'm not on this list</option></select>` : ''}
    <div id="newname" style="${people.length ? 'display:none' : ''}">
      <label for="nm">First name and last initial</label>
      <input id="nm" placeholder="Jake M" autocomplete="off">
      <p class="hint">Everyone after you picks from this list, so keep it recognisable.</p>
    </div>
    <button class="newbtn" onclick="claim(this)">Continue</button>
  </div>`;
  const pick = document.getElementById('pick');
  if (pick) pick.onchange = () => {
    document.getElementById('newname').style.display = pick.value === '__new' ? 'block' : 'none';
  };
}

/* ---- identity ---- */

async function claim(btn) {
  const pick = document.getElementById('pick');
  const chosen = pick ? pick.value : '__new';
  if (!chosen) return toast('Pick a name first');
  if (chosen !== '__new') { meId = chosen; remember(meId); return render(); }

  const nm = document.getElementById('nm').value.trim();
  if (!nm) return toast('Type your name first');
  const dupe = people.find(p => String(p.name).toLowerCase() === nm.toLowerCase());
  if (dupe) { meId = dupe.id; remember(meId); return render(); }

  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const [row] = await insert('people', { name: nm.slice(0, 60) });
    people.push({ id: row.id, name: row.name });
    meId = row.id; remember(meId); stash(); render();
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Continue';
    toast("Couldn't save that — try again");
  }
}
function remember(id) { try { localStorage.setItem('siena:me', id); } catch (e) {} }
function forget() {
  try { localStorage.removeItem('siena:me'); } catch (e) {}
  meId = null; render();
}

/* ---- rsvp ---- */

function rsvp(tripId, status) {
  const i = rsvps.findIndex(r => r.tripId === tripId && r.personId === meId);
  const clearing = i > -1 && rsvps[i].status === status;
  if (clearing) rsvps.splice(i, 1);
  else if (i > -1) rsvps[i] = { ...rsvps[i], status };
  else rsvps.push({ tripId, personId: meId, status });
  render(); stash();
  enqueue(() => clearing
    ? removeRsvp(tripId, meId)
    : upsertRsvp({ trip_id: tripId, person_id: meId, status,
                   updated_at: new Date().toISOString() }));
}

function dropTrip(tripId) {
  if (!confirm('Delete this trip for everyone?')) return;
  trips = trips.filter(t => t.id !== tripId);
  rsvps = rsvps.filter(r => r.tripId !== tripId);
  render(); stash();
  enqueue(() => api(`trips?id=eq.${tripId}`, { method:'DELETE' }));
}

async function refresh(btn) {
  btn.textContent = 'refreshing…';
  try { await load(); } catch (e) { offline = true; }
  render();
}

/* ---- propose / edit ---- */

const FIELDS = [
  ['destination', 'Destination'], ['start', 'Departure'], ['end', 'Return'],
  ['meetPoint', 'Meeting point'], ['meetTime', 'Meeting time'],
  ['cost', 'Cost'], ['minPeople', 'Minimum people']
];

function describeChanges(before, after) {
  const out = [];
  for (const [k, label] of FIELDS) {
    const a = before[k] == null || before[k] === '' ? '' : String(before[k]);
    const b = after[k]  == null || after[k]  === '' ? '' : String(after[k]);
    if (a === b) continue;
    if (!a) out.push(`${label} set to ${b}`);
    else if (!b) out.push(`${label} removed`);
    else out.push(`${label} ${a} → ${b}`);
  }
  if (String(before.notes || '') !== String(after.notes || '')) out.push('notes updated');
  return out.join('; ');
}

function openForm(tripId) {
  const t = tripId ? trips.find(x => x.id === tripId) : null;
  const val = v => v == null ? '' : esc(v);
  const el = document.createElement('div');
  el.className = 'sheet';
  el.onclick = e => { if (e.target === el) el.remove(); };
  el.innerHTML = `<div class="sheet-inner">
    <h2>${t ? 'Edit trip' : 'Propose a trip'}</h2>
    ${t ? `<p class="lede">Anyone already signed up will see what you changed.</p>` : ''}
    <label for="f-dest">Where</label>
    <input id="f-dest" placeholder="Florence" autocomplete="off" value="${val(t && t.destination)}">
    <div class="row">
      <div><label for="f-start">Leaving</label>
        <input id="f-start" type="date" value="${val(t ? t.start : today())}"></div>
      <div><label for="f-end">Back</label>
        <input id="f-end" type="date" value="${val(t && t.end)}"></div>
    </div>
    <p class="hint">Leave "back" empty for a day trip.</p>
    <div class="row">
      <div><label for="f-point">Meet at</label>
        <input id="f-point" placeholder="Piazza Gramsci" value="${val(t && t.meetPoint)}"></div>
      <div><label for="f-time">Time</label>
        <input id="f-time" placeholder="07:40" value="${val(t && t.meetTime)}"></div>
    </div>
    <div class="row">
      <div><label for="f-cost">Rough cost &euro;</label>
        <input id="f-cost" type="number" min="0" placeholder="18" value="${val(t && t.cost)}"></div>
      <div><label for="f-min">Min. people</label>
        <input id="f-min" type="number" min="0" placeholder="6" value="${val(t && t.minPeople)}"></div>
    </div>
    <label for="f-notes">Anything else</label>
    <textarea id="f-notes" placeholder="Hostel deposit due Monday">${val(t && t.notes)}</textarea>
    <button class="newbtn" onclick="saveTrip(this, ${t ? `'${t.id}'` : 'null'})">
      ${t ? 'Save changes' : 'Add to the board'}</button>
  </div>`;
  document.body.appendChild(el);
  document.getElementById('f-dest').focus();
}

async function saveTrip(btn, tripId) {
  const v = id => document.getElementById(id).value.trim();
  if (!v('f-dest'))  return toast('Where are you going?');
  if (!v('f-start')) return toast('Pick a date');

  const body = {
    destination: v('f-dest').slice(0, 80),
    start_date:  v('f-start'),
    end_date:    v('f-end') || null,
    meet_point:  v('f-point') || null,
    meet_time:   v('f-time') || null,
    cost:        v('f-cost') ? Number(v('f-cost')) : null,
    min_people:  v('f-min') ? Number(v('f-min')) : null,
    notes:       v('f-notes') ? v('f-notes').slice(0, 400) : null
  };

  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    if (tripId) {
      const before = trips.find(t => t.id === tripId);
      const after  = shapeTrip({ ...body, id: tripId, proposed_by: before.proposedBy });
      const summary = describeChanges(before, after);
      if (!summary) { document.querySelector('.sheet').remove(); return; }
      body.last_change = summary.slice(0, 300);
      body.updated_at  = new Date().toISOString();
      const [row] = await patch('trips', `id=eq.${tripId}`, body);
      trips = trips.map(t => t.id === tripId ? shapeTrip(row) : t);
    } else {
      const [row] = await insert('trips', { ...body, proposed_by: meId });
      trips.push(shapeTrip(row));
      rsvps.push({ tripId: row.id, personId: meId, status: 'in' });
      enqueue(() => upsertRsvp({ trip_id: row.id, person_id: meId, status: 'in',
                                 updated_at: new Date().toISOString() }));
      showPast = false;
    }
    document.querySelector('.sheet').remove();
    stash(); render();
  } catch (e) {
    btn.disabled = false; btn.textContent = tripId ? 'Save changes' : 'Add to the board';
    toast("Couldn't save — try again");
  }
}

/* ---- the randomiser ---- */

let drawMode = 'coin';

const MODE_COPY = {
  coin:     { title:'Flip a coin', lede:'Two options, one answer, no arguing.',
              cta:'Flip' },
  list:     { title:'Pick one',    lede:'One per line. Something gets chosen.',
              cta:'Draw' },
  dictator: { title:'Appoint someone', lede:'One name per line. Whoever is drawn decides, and nobody else gets a say.',
              cta:'Appoint' }
};

function openDraw() {
  const el = document.createElement('div');
  el.className = 'sheet';
  el.id = 'drawsheet';
  el.onclick = e => { if (e.target === el) el.remove(); };
  el.innerHTML = `<div class="sheet-inner" id="drawbody"></div>`;
  document.body.appendChild(el);
  renderDraw();
}

function setMode(m) { drawMode = m; renderDraw(); }

function renderDraw(result) {
  const body = document.getElementById('drawbody');
  if (!body) return;
  const c = MODE_COPY[drawMode];

  const inputs = drawMode === 'coin'
    ? `<label for="d-a">Option one</label>
       <input id="d-a" placeholder="Florence" autocomplete="off">
       <label for="d-b">Option two</label>
       <input id="d-b" placeholder="Stay in Siena" autocomplete="off">`
    : `<label for="d-items">${drawMode === 'dictator' ? 'Names' : 'Options'}, one per line</label>
       <textarea id="d-items" rows="5" placeholder="${drawMode === 'dictator'
          ? 'Jake M\nPriya S\nMarco T' : 'Pizzeria\nOsteria\nThat place by the Campo'}"></textarea>`;

  body.innerHTML = `
    <h2>${c.title}</h2>
    <p class="lede">${c.lede}</p>
    <div class="modes">
      ${['coin','list','dictator'].map(m =>
        `<button class="${m === drawMode ? 'on' : ''}" onclick="setMode('${m}')">${
          m === 'coin' ? 'Coin' : m === 'list' ? 'Pick one' : 'Appoint'}</button>`).join('')}
    </div>
    <label for="d-q">What's this deciding? (optional)</label>
    <input id="d-q" placeholder="Where to eat tonight" autocomplete="off" value="${esc(lastQuestion)}">
    ${inputs}
    ${result ? verdictHtml(result) : ''}
    <button class="newbtn" id="d-go" onclick="doDraw(this)">${c.cta}</button>
    ${ledgerHtml()}`;
}

let lastQuestion = '';

function verdictHtml(r) {
  const said = r.kind === 'coin'     ? 'The coin has spoken.'
             : r.kind === 'dictator' ? 'Appointed. The matter rests with them.'
             : `Drawn from ${r.items.length} options.`;
  return `<div class="verdict">
    ${r.question ? `<span class="q">${esc(r.question)}</span>` : ''}
    <span class="r">${esc(r.result)}</span>
    <span class="said">${said}</span>
  </div>`;
}

function ledgerHtml() {
  const recent = draws.slice(0, 12);
  const counts = {};
  return `<div class="ledger"><span class="cap">The ledger</span>
    ${recent.length ? `<ol>${recent.map(d => {
      const key = (d.question || '').trim().toLowerCase();
      let again = '';
      if (key) {
        const total = draws.filter(x => (x.question || '').trim().toLowerCase() === key).length;
        counts[key] = (counts[key] || 0) + 1;
        const nth = total - counts[key] + 1;
        if (nth > 1) again = ` <span class="again">attempt ${nth}</span>`;
      }
      return `<li>${d.question ? esc(d.question) + ' — ' : ''}<b>${esc(d.result)}</b>${again}
        <br>${esc(nameOf(d.drawn_by))} · ${ago(d.created_at)}</li>`;
    }).join('')}</ol>`
    : `<p class="none">Nothing settled yet.</p>`}
  </div>`;
}

async function doDraw(btn) {
  const q = document.getElementById('d-q').value.trim().slice(0, 80);
  let items;

  if (drawMode === 'coin') {
    const a = document.getElementById('d-a').value.trim();
    const b = document.getElementById('d-b').value.trim();
    if (!a || !b) return toast('Fill in both options');
    items = [a, b];
  } else {
    items = document.getElementById('d-items').value
      .split('\n').map(s => s.trim()).filter(Boolean);
    if (items.length < 2) return toast('Give it at least two to choose from');
  }
  items = items.slice(0, 30).map(s => s.slice(0, 60));

  lastQuestion = q;
  btn.disabled = true;
  btn.textContent = drawMode === 'dictator' ? 'Appointing…' : 'Drawing…';

  const result = pick(items);
  const row = { kind: drawMode, question: q || null, items, result, drawn_by: meId };

  await new Promise(r => setTimeout(r, 750));

  draws.unshift({ ...row, created_at: new Date().toISOString() });
  stash();
  renderDraw({ ...row, items });
  enqueue(() => insert('draws', row));
}

/* ---- misc ---- */

function copyTrip(id) {
  const t = trips.find(x => x.id === id);
  const mine = rsvps.filter(r => r.tripId === id);
  const going = mine.filter(r => r.status === 'in').length;
  const maybe = mine.filter(r => r.status === 'maybe').length;
  const when = fmt(t.start) + (t.end && t.end > t.start ? ` – ${fmt(t.end)}` : '');
  const bits = [`${t.destination}, ${when}`];
  if (t.meetPoint || t.meetTime) bits.push(`meet ${[t.meetPoint,t.meetTime].filter(Boolean).join(' ')}`);
  if (t.cost) bits.push(`~€${Math.round(t.cost)}`);
  bits.push(`${going} in${maybe ? `, ${maybe} maybe` : ''}`);
  const text = bits.join(' — ');
  const done = () => toast('Copied — paste it in the chat');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:absolute;left:-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast(text); }
  ta.remove();
}

function togglePast() { showPast = !showPast; render(); }

let toastTimer;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2600);
}

(async function init() {
  const app = document.getElementById('app');
  try { meId = localStorage.getItem('siena:me'); } catch (e) {}
  const hadCache = unstash();
  if (hadCache) render();
  try {
    await load();
    if (meId && !people.some(p => p.id === meId)) meId = null;
    render();
  } catch (e) {
    offline = true;
    if (hadCache) render();
    else app.innerHTML = `<div class="state err">Couldn't reach the database, and there's
      nothing saved on this device yet. Check your signal and reload.<br><br>
      <code>${esc(e.message)}</code></div>`;
  }
})();
</script>
